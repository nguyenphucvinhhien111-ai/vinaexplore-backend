spring.application.name=backend

# ==========================================
# 1. CẤU HÌNH DATABASE (ĐÃ ẨN KEY)
# ==========================================
# Gộp các thông tin nhạy cảm thành biến môi trường, có sẵn giá trị mặc định (local) để chạy test nếu cần
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:defaultdb}?sslMode=REQUIRED
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:your_local_password_here}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# 2. CẤU HÌNH JPA / HIBERNATE
# ==========================================
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
# Từ Hibernate 6 (Spring Boot 3.x), khuyến khích dùng Dialect chung, Hibernate sẽ tự nhận diện phiên bản MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================
# 3. CẤU HÌNH SECURITY & JWT (ĐÃ ẨN KEY)
# ==========================================
jwt.secret=${JWT_SECRET:DayLaKhoaBiMatCuaVinatourPhaiDuDaiTren32KyTu}
jwt.expiration=86400000 

# ==========================================
# 4. CẤU HÌNH ĐƯỜNG DẪN FRONTEND (DÙNG CHO CORS)
# ==========================================
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# ==========================================
# 5. CẤU HÌNH CLOUDINARY (CHỜ ĐIỀN BIẾN)
# ==========================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ==========================================
# 6. CẤU HÌNH REDIS (CHỜ ĐIỀN BIẾN)
# ==========================================
spring.data.redis.host=${REDIS_HOST:}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=true

# ==========================================
# 7. CẤU HÌNH GMAIL SMTP (CHỜ ĐIỀN BIẾN)
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# 8. CẤU HÌNH OAUTH2 GOOGLE (CHỜ ĐIỀN BIẾN)
# ==========================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}

# ==========================================
# 9. CẤU HÌNH GEMINI AI (CHỜ ĐIỀN BIẾN)
# ==========================================
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.options.model=gemini-2.5-flash